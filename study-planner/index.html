<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Study Planner — dated checklist | Binod Suman</title>
    <meta name="description" content="Plan what to study today or this week. Add, edit, strikethrough, and export. Saved only in your browser.">
    <link rel="canonical" href="https://binodsuman.com/study-planner/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site-nav.css">
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/study-planner.css">
</head>
<body class="study-planner-page">
    <main class="study-page" id="study-list">
        <header class="study-page-hero">
            <h1>Study Planner</h1>
            <p>Write what to study by date, or keep a backlog. Check off to strikethrough. Nothing is uploaded.</p>
        </header>
        <div class="study-layout">
            <div class="study-planner-card">
                <header class="study-planner-head">
                    <div>
                        <h2 id="studyListTitle">Your list</h2>
                        <p class="study-planner-privacy">Saved only in this browser. Export if you switch devices.</p>
                    </div>
                    <p class="study-planner-progress" id="studyProgress"></p>
                </header>
                <form class="study-add" id="studyAddForm">
                    <input type="text" id="studyTitle" maxlength="200" placeholder="What to study…" autocomplete="off" aria-label="Study item">
                    <input type="date" id="studyDate" aria-label="Optional date">
                    <button type="submit" class="study-btn">Add</button>
                </form>
                <div class="study-toolbar">
                    <div class="study-filters" role="group" aria-label="Filter list">
                        <button type="button" class="study-filter is-active" data-filter="all">All</button>
                        <button type="button" class="study-filter" data-filter="today">Today</button>
                        <button type="button" class="study-filter" data-filter="week">This week</button>
                        <button type="button" class="study-filter" data-filter="nodate">No date</button>
                        <button type="button" class="study-filter" data-filter="done">Done</button>
                    </div>
                    <div class="study-toolbar-actions">
                        <button type="button" class="study-btn-ghost" id="studyClearDone">Clear done</button>
                        <button type="button" class="study-btn-ghost" id="studyExport">Export</button>
                        <button type="button" class="study-btn-ghost" id="studyImportBtn">Import</button>
                        <input type="file" id="studyImport" accept="application/json,.json" hidden>
                    </div>
                </div>
                <div id="studyGroups" class="study-groups"></div>
            </div>
            <aside class="study-suggest-card">
                <h2>Suggested today</h2>
                <p id="studyRevision">Pick a topic from this site, or add it to your list.</p>
                <div id="studySuggest" class="study-suggest-list"></div>
            </aside>
        </div>
    </main>
    <script src="/js/site-nav.js"></script>
    <script src="/js/study-planner.js"></script>
</body>
</html>
